<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — {{sitename}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {{fonts}}
  {{alternates}}
  <link rel="icon" type="image/png" href="{{root}}assets/brand/monogram.png">
  <link rel="apple-touch-icon" href="{{root}}assets/brand/monogram.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}} — {{sitename}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="https://motazomarien.com/assets/brand/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="alternate" type="application/rss+xml" title="RSS — {{sitename}}" href="https://motazomarien.com/feed.xml">
  <link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body>
  <header class="site-header">
    <img class="site-logo" src="{{root}}assets/brand/monogram.png" alt="{{sitename}}">
    <a class="site-name" href="{{home}}">{{sitename}}</a>
    <p class="site-tagline">{{tagline}}</p>
    <nav class="site-nav">{{pagenav}}</nav>
    <nav class="langs">{{langs}}</nav>
  </header>
  <main>
    {{content}}
  </main>
  <footer class="site-footer">
    <p>{{footer}}</p>
  </footer>
  <script>
  (function () {
    var form = document.getElementById('subscribe-form');
    if (form) {
      form.setAttribute('target', 'mc_frame');
      form.addEventListener('submit', function () {
        var note = document.getElementById('subscribe-thanks');
        setTimeout(function () {
          form.hidden = true;
          if (note) { note.hidden = false; }
        }, 400);
      });
    }
    var copyButtons = document.querySelectorAll('.copy-link');
    Array.prototype.forEach.call(copyButtons, function (btn) {
      btn.hidden = false;
      btn.addEventListener('click', function () {
        var label = btn.getAttribute('data-label') || btn.textContent;
        var done = function () {
          btn.textContent = btn.getAttribute('data-copied') || label;
          setTimeout(function () { btn.textContent = label; }, 2000);
        };
        var url = btn.getAttribute('data-url');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function () {});
        } else {
          var field = document.createElement('textarea');
          field.value = url;
          field.setAttribute('readonly', '');
          field.style.position = 'absolute';
          field.style.left = '-9999px';
          document.body.appendChild(field);
          field.select();
          try { document.execCommand('copy'); done(); } catch (err) {}
          document.body.removeChild(field);
        }
      });
    });
  })();
  </script>
</body>
</html>
